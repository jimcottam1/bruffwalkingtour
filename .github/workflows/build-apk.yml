name: Build & Release APK

on:
  push:
  pull_request:
  workflow_dispatch:   # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Android unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web unit tests
        working-directory: web
        run: |
          npm ci
          npx vitest run

      - name: Web e2e tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  build:
    # Only ship an APK from main, and only once the tests pass.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Release (not debug): the debug build has a developer-only way past the
      # "you must be in Bruff" gate, which must not reach visitors.
      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/bruff-tour.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruff-tour-apk
          path: app/build/outputs/apk/release/bruff-tour.apk
          retention-days: 30

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            **Bruff Walking Tour — latest build**

            Built automatically from the most recent commit on `main`.

            ### Install instructions
            1. Download `bruff-tour.apk` below.
            2. Open the file on your Android phone.
            3. If prompted, allow installation from unknown sources.
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/release/bruff-tour.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
